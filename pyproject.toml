[project]
name = "engrai-server"
version = "0.1.0"
description = "A sovereign, GPU-agnostic host control plane and runtime orchestrator"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ai", "inference", "llama.cpp", "diffusion", "gpu", "orchestration"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=1.0,<3",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]
[project.urls]
Repository = "https://github.com/va-desai-dev/ENGRAISERVER"
Issues = "https://github.com/va-desai-dev/ENGRAISERVER/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engrai_server"]

# force-include bypasses exclusions, so list only the portable parts of
# @models; machine-local profiles under @models/local must never ship.
[tool.hatch.build.targets.wheel.force-include]
"@models/README.md" = "engrai_server/model_catalog/README.md"
"@models/catalog" = "engrai_server/model_catalog/catalog"
"@models/schemas" = "engrai_server/model_catalog/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/@models",
  "/src",
  "/ui/src",
  "/ui/public",
  "/ui/index.html",
  "/ui/package.json",
  "/ui/package-lock.json",
  "/ui/tsconfig.json",
  "/ui/vite.config.ts",
  "/ui/START-HERE.md",
  "/scripts/build-ui.sh",
  "/scripts/build-runtime.py",
  "/scripts/fetch-engine-sources.py",
  "/runtime",
  "/third_party/README.md",
  "/scripts/dev.sh",
  "/tests",
  "/docs",
  "/deploy",
  "/Containerfile",
  "/compose.yaml",
  "/.dockerignore",
  "/.env.example",
  "/.python-version",
  "/README.md",
  "/LICENSE.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/@models/local",
  "/commands",
  "/image-commands",
  "/state",
  "/ui/node_modules",
]

[project.scripts]
engrai-server = "engrai_server.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "playwright>=1.40,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
