name: Build complete CLI bundles

# Every mainline change produces fresh artifacts; version tags stage a draft.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install test dependencies
        run: uv sync --frozen --extra dev
      - name: Check application versions and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --frozen python scripts/check-version.py --tag "$RELEASE_TAG"
      - name: Build the current UI source
        run: ./scripts/build-ui.sh
      - name: Test application and packaging contracts
        run: uv run --frozen pytest

  bundle:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64-cpu
            backend: cpu
          - runner: ubuntu-22.04-arm
            target: linux-aarch64-cpu
            backend: cpu
          - runner: macos-14
            target: macos-aarch64-metal
            backend: metal
          - runner: macos-15-intel
            target: macos-x86_64-cpu
            backend: cpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install build dependencies (maintainer environment only)
        run: uv sync --frozen --extra dev
      - name: Test runtime and installer contracts
        run: uv run --frozen pytest tests/test_runtime.py tests/test_cli.py tests/test_cli_bundle.py tests/test_cli_installer.py tests/test_host.py tests/test_worker.py tests/test_image_generation.py tests/test_symlink.py
      - name: Fetch pinned engine sources
        run: uv run --frozen python scripts/fetch-engine-sources.py
      - name: Build text inference engine
        env:
          BACKEND: ${{ matrix.backend }}
        run: uv run --frozen python scripts/build-runtime.py --engine llama.cpp --backend "$BACKEND" --jobs 3
      - name: Build image inference engine
        env:
          BACKEND: ${{ matrix.backend }}
        run: uv run --frozen python scripts/build-runtime.py --engine stable-diffusion.cpp --backend "$BACKEND" --jobs 3
      - name: Package and check the standalone CLI
        shell: bash
        run: |
          text=(dist/runtime/engrai-text-*.tar.gz)
          image=(dist/runtime/engrai-image-*.tar.gz)
          uv run --frozen --with pyinstaller==6.22.3 python scripts/build-cli-bundle.py \
            --text-runtime "${text[0]}" --image-runtime "${image[0]}"
      - name: Install and update without developer tools
        env:
          ENGRAI_TEST_CLI_BUNDLE: dist/cli/engrai-server-${{ matrix.target }}.tar.gz
        run: uv run --frozen pytest tests/test_cli_installer.py -k real_bundle
      - uses: actions/upload-artifact@v4
        with:
          name: engrai-server-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error
          compression-level: 0

  linux-compatibility:
    needs: bundle
    # A macOS build failure must not skip checks of the Linux artifacts.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64-cpu
          - runner: ubuntu-24.04-arm
            target: linux-aarch64-cpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engrai-server-${{ matrix.target }}
          path: downloaded-bundle
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - name: Install test driver dependencies
        run: uv sync --frozen --extra dev
      - name: Install Ubuntu 22.04 bundle on Ubuntu 24.04 and preserve saved data on update
        env:
          ENGRAI_TEST_CLI_BUNDLE: downloaded-bundle/engrai-server-${{ matrix.target }}.tar.gz
        run: uv run --frozen pytest tests/test_cli_installer.py -k real_bundle

  release:
    needs: [validate, bundle, linux-compatibility]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engrai-server-*
          merge-multiple: true
          path: release-assets
      - name: Verify all platform archives and checksums
        working-directory: release-assets
        run: |
          for target in linux-x86_64-cpu linux-aarch64-cpu macos-aarch64-metal macos-x86_64-cpu; do
            test -s "engrai-server-${target}.tar.gz"
            sha256sum --check "engrai-server-${target}.tar.gz.sha256"
          done
      - name: Create or update the version's draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets of published release $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ENGRAISERVER $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
