<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what lets env(safe-area-inset-*) report real
         numbers on a notched iPhone; without it the insets are always zero
         and the layout collides with the notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0709" />
    <meta name="description" content="Private model routing and OpenAI API control" />
    <!-- Launches without Safari's chrome once added to the home screen, which
         is the whole reason this reads as an app rather than a page. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ENGRAI SERVER" />
    <title>ENGRAI SERVER</title>
    <link rel="icon" href="/favicon.svg?v=47ff778c" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
